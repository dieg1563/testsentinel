<!--
  ossec-localfile.conf : bloc à insérer dans /var/ossec/etc/ossec.conf
  du conteneur wazuh.manager (dans la section <ossec_config>).

  Déclare la lecture du fichier de log JSON de l'app (cf. CONTRACT.md section 4).
  Le log_format "json" active le décodeur JSON natif : tous les champs
  deviennent accessibles sous data.* dans les règles.
-->

<localfile>
  <log_format>json</log_format>
  <location>/var/log/supportdesk/app.json</location>
</localfile>
